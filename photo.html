<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पर्यटन स्थळाचे फोटो</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff7e6}
header{background:linear-gradient(135deg,#ff9800,#e65100);color:white;text-align:center;padding:25px 10px}
header h1{font-size:28px}
.container{width:92%;max-width:1000px;margin:30px auto}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.15)}
.place-name{text-align:center;color:#e65100;font-size:28px;margin-bottom:25px}
.main-photo{width:100%;max-height:520px;object-fit:cover;border-radius:15px;display:block;margin:auto}
.gallery-title{color:#e65100;font-size:22px;font-weight:bold;margin:25px 0 15px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.gallery img{width:100%;height:180px;object-fit:cover;border-radius:12px;cursor:pointer}
.message{text-align:center;padding:30px;font-size:18px;color:#555}
.loading{padding:30px;text-align:center;font-size:18px;color:#e65100}
.back-btn{display:inline-block;margin-top:25px;background:#333;color:white;text-decoration:none;padding:13px 22px;border-radius:8px;font-size:17px}
.source{text-align:center;margin-top:15px;color:#777;font-size:13px}
</style>
</head>
<body>

<header>
  <h1>📸 पर्यटन स्थळाचे फोटो</h1>
</header>

<div class="container">
  <div class="card">
    <h2 id="placeName" class="place-name">फोटो शोधत आहे...</h2>
    <div id="photoContent">
      <div class="loading">🔎 इंटरनेटवर फोटो शोधत आहे...</div>
    </div>
    <a href="javascript:history.back()" class="back-btn">⬅️ मागे जा</a>
  </div>
</div>

<script>
const placeData = localStorage.getItem("selectedPlace");

if(!placeData){
  alert("पर्यटन स्थळाची माहिती सापडली नाही.");
  window.location.href="index.html";
}else{
  try{
    const place = JSON.parse(placeData);
    const placeName = place.name || "पर्यटन स्थळ";

    document.getElementById("placeName").textContent = placeName;

    // JSON मध्ये आधीपासून gallery/image असेल तर ते प्रथम वापरले जातील.
    // फोटो नसल्यास Wikimedia Commons वरून फोटो आपोआप शोधले जातील.
    const localPhotos = [];

    if(place.image) localPhotos.push(place.image);

    if(Array.isArray(place.gallery)){
      place.gallery.forEach(function(p){
        if(p && !localPhotos.includes(p)) localPhotos.push(p);
      });
    }

    // आधी local image paths तपासा.
    // फाइल उपलब्ध नसेल तर Wikimedia Commons वरून automatic search.
    if(localPhotos.length > 0){
      showLocalOrOnlinePhotos(localPhotos, placeName);
    }else{
      searchWikimedia(placeName);
    }

  }catch(error){
    document.getElementById("photoContent").innerHTML =
      '<div class="message">⚠️ माहिती वाचता आली नाही.</div>';
  }
}

function showLocalOrOnlinePhotos(paths, placeName){
  const content = document.getElementById("photoContent");

  let checked = 0;
  let valid = [];

  paths.forEach(function(src){
    const img = new Image();

    img.onload = function(){
      valid.push(src);
      checked++;

      if(checked === paths.length){
        if(valid.length > 0){
          renderPhotos(valid, placeName, "तुमच्या JSON मधील फोटो");
        }else{
          searchWikimedia(placeName);
        }
      }
    };

    img.onerror = function(){
      checked++;

      if(checked === paths.length){
        if(valid.length > 0){
          renderPhotos(valid, placeName, "तुमच्या JSON मधील उपलब्ध फोटो");
        }else{
          searchWikimedia(placeName);
        }
      }
    };

    img.src = src;
  });
}

async function searchWikimedia(placeName){
  const content = document.getElementById("photoContent");
  content.innerHTML = '<div class="loading">🔎 Wikimedia Commons वर फोटो शोधत आहे...</div>';

  try{
    const queries = [
      placeName,
      placeName.replace(/श्री|देवस्थान|मंदिर/g, "").trim(),
      placeName.split(" ")[0]
    ];

    let images = [];

    for(const q of queries){
      if(!q) continue;

      const api =
        "https://commons.wikimedia.org/w/api.php" +
        "?action=query" +
        "&generator=search" +
        "&gsrsearch=" + encodeURIComponent(q) +
        "&gsrnamespace=6" +
        "&gsrlimit=8" +
        "&prop=imageinfo" +
        "&iiprop=url" +
        "&iiurlwidth=1200" +
        "&format=json" +
        "&origin=*";

      const response = await fetch(api);
      const data = await response.json();

      if(data.query && data.query.pages){
        Object.values(data.query.pages).forEach(function(page){
          if(page.imageinfo && page.imageinfo[0]){
            const info = page.imageinfo[0];
            const url = info.thumburl || info.url;
            if(url && !images.includes(url)) images.push(url);
          }
        });
      }

      if(images.length >= 6) break;
    }

    if(images.length > 0){
      renderPhotos(images.slice(0,6), placeName, "Wikimedia Commons");
    }else{
      content.innerHTML =
        '<div class="message">⚠️ या पर्यटन स्थळासाठी इंटरनेटवर फोटो सापडला नाही.</div>';
    }

  }catch(error){
    content.innerHTML =
      '<div class="message">⚠️ फोटो शोधता आले नाहीत.<br>कृपया इंटरनेट कनेक्शन तपासा.</div>';
  }
}

function renderPhotos(images, placeName, source){
  const content = document.getElementById("photoContent");

  let html = "";

  if(images.length > 0){
    html += '<img class="main-photo" src="' + escapeHtml(images[0]) +
            '" alt="' + escapeHtml(placeName) + '">';
  }

  if(images.length > 1){
    html += '<div class="gallery-title">🖼️ फोटो गॅलरी</div>';
    html += '<div class="gallery">';

    images.slice(1).forEach(function(photo){
      html += '<img src="' + escapeHtml(photo) +
              '" alt="' + escapeHtml(placeName) +
              '" onclick="window.open(this.src, \'_blank\')">';
    });

    html += '</div>';
  }

  html += '<div class="source">फोटो स्रोत: ' + escapeHtml(source) + '</div>';

  content.innerHTML = html;
}

function escapeHtml(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
</script>

</body>
</html>
