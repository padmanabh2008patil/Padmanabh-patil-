<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Google Map - Maharashtra Tourism</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:linear-gradient(135deg,#ff9800,#e65100);
color:white;
text-align:center;
padding:25px;
}

header h1{
font-size:28px;
}

.container{
width:92%;
max-width:900px;
margin:30px auto;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.place-name{
text-align:center;
color:#e65100;
font-size:28px;
margin-bottom:20px;
}

.location{
background:#fff3e0;
padding:15px;
border-radius:10px;
font-size:18px;
text-align:center;
margin-bottom:20px;
}

.map-box{
width:100%;
height:450px;
border-radius:15px;
overflow:hidden;
background:#eee;
}

.map-box iframe{
width:100%;
height:100%;
border:0;
}

.buttons{
text-align:center;
margin-top:25px;
}

.map-button,
.back-button{
display:inline-block;
padding:13px 22px;
border-radius:8px;
text-decoration:none;
font-size:17px;
font-weight:bold;
margin:5px;
}

.map-button{
background:#e65100;
color:white;
}

.back-button{
background:#333;
color:white;
}

</style>

</head>


<body>

<header>

<h1>🗺️ पर्यटन स्थळाचा नकाशा</h1>

</header>


<div class="container">

<div class="card">

<h2 id="placeName"
class="place-name">

नकाशा शोधत आहे...

</h2>


<div id="location"
class="location">

कृपया थोडा वेळ थांबा...

</div>


<div class="map-box"
id="mapBox">

</div>


<div class="buttons">

<a id="googleMapButton"
class="map-button"
href="#"
target="_blank"
rel="noopener noreferrer">

🗺️ Google Maps वर उघडा

</a>


<a href="javascript:history.back()"
class="back-button">

⬅️ मागे जा

</a>

</div>

</div>

</div>


<script>

// selectedPlace मिळवणे

const placeData =
localStorage.getItem("selectedPlace");


// Data उपलब्ध नसेल तर

if(!placeData){

alert(
"पर्यटन स्थळाची माहिती सापडली नाही."
);

window.location.href =
"index.html";

}


// JSON मध्ये convert करणे

const place =
JSON.parse(placeData);


// नाव दाखवणे

document.getElementById(
"placeName"
).innerHTML =
place.name;


// Location दाखवणे

document.getElementById(
"location"
).innerHTML =
"📍 " + (place.location || "Location उपलब्ध नाही");


// Map URL

const map =
place.map || "";


// Google Maps button

const googleMapButton =
document.getElementById(
"googleMapButton"
);


if(map){

googleMapButton.href =
map;

}


// Map मध्ये Google Maps दाखवणे

const mapBox =
document.getElementById(
"mapBox"
);


if(map){

const embedMap =
map.replace(
"/search/?api=1&query=",
"/embed?query="
);


mapBox.innerHTML = `

<iframe
src="${embedMap}"
loading="lazy"
allowfullscreen>
</iframe>

`;

}else{

mapBox.innerHTML = `

<div style="
height:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
">

⚠️ या पर्यटन स्थळाचा नकाशा उपलब्ध नाही.

</div>

`;

}

</script>


</body>

</html>
