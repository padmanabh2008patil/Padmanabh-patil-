<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maharashtra Tourism Explorer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:linear-gradient(135deg,#ff9800,#e65100);
color:white;
padding:30px;
text-align:center;
}

header h1{
font-size:40px;
}

header p{
margin-top:10px;
font-size:20px;
}

.search{
width:90%;
max-width:600px;
margin:30px auto;
}

.search input{
width:100%;
padding:16px;
font-size:18px;
border-radius:30px;
border:none;
box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.container{
width:90%;
margin:auto;
}

.title{
text-align:center;
margin:30px;
font-size:30px;
color:#e65100;
}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:50px;

}

.card{

background:white;

padding:20px;

border-radius:15px;

text-align:center;

cursor:pointer;

transition:.3s;

box-shadow:0 4px 12px rgba(0,0,0,.15);

}

.card:hover{

background:#fff3e0;

transform:translateY(-5px);

}

.card h3{

font-size:22px;

margin-top:10px;

}

footer{

background:#333;

color:white;

padding:20px;

text-align:center;

}

</style>

</head>

<body>

<header>

<h1>MAHARASHTRA TOURISM EXPLORER</h1>

<p>महाराष्ट्रातील पर्यटन स्थळे शोधा</p>

</header>


<div class="search">

<input

type="text"

id="search"

placeholder="🔍 महाराष्ट्रातील जिल्हा शोधा..."

onkeyup="searchDistrict()"

>

</div>


<div class="container">

<h2 class="title">

📍 महाराष्ट्रातील सर्व जिल्हे

</h2>

<div

class="grid"

id="districtList">

</div>

</div>


<footer>

© 2026 Maharashtra Tourism Explorer

</footer>


<script>

const districts=[

"अहमदनगर",

"अकोला",

"अमरावती",

"बीड",

"भंडारा",

"बुलढाणा",

"चंद्रपूर",

"छत्रपती संभाजीनगर",

"धाराशिव",

"धुळे",

"गडचिरोली",

"गोंदिया",

"हिंगोली",

"जळगाव",

"जालना",

"कोल्हापूर",

"लातूर",

"मुंबई शहर",

"मुंबई उपनगर",

"नागपूर",

"नांदेड",

"नंदुरबार",

"नाशिक",

"पालघर",

"परभणी",

"पुणे",

"रायगड",

"रत्नागिरी",

"सांगली",

"सातारा",

"सिंधुदुर्ग",

"सोलापूर",

"ठाणे",

"वर्धा",

"वाशीम",

"यवतमाळ"

];

function loadDistricts(list){

const container=document.getElementById("districtList");

container.innerHTML="";

list.forEach(d=>{

container.innerHTML+=`

<div class="card"

onclick="selectDistrict('${d}')">

📍

<h3>${d}</h3>

</div>

`;

});

}

loadDistricts(districts);

function searchDistrict(){

const text=document

.getElementById("search")

.value

.toLowerCase();

const filtered=districts.filter(d=>

d.toLowerCase().includes(text)

);

loadDistricts(filtered);

}

function selectDistrict(name){

    localStorage.setItem("district", name);

    window.location.href = "category.html";

}

</script>

</body>
</html>
<div class="card" onclick="openCategory('nature')">

🌄
<h2>नैसर्गिक पर्यटन</h2>

</div>

<div class="card" onclick="openCategory('wildlife')">

🐅
<h2>वन्यजीव पर्यटन</h2>

</div>

<div class="card" onclick="openCategory('other')">

🎡
<h2>इतर पर्यटन</h2>

</div>

</div>

</div>

<footer>

© 2026 Maharashtra Tourism Explorer

</footer>

<script>

const district = localStorage.getItem("district");

document.getElementById("districtName").innerHTML =
district + " जिल्हा";

function openCategory(category){

localStorage.setItem("category",category);

window.location.href="place.html";

}
