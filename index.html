<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maharashtra Tourism Explorer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #ff6f00, #e65100);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 20px;
        }

        /* Search */
        .search-container {
            text-align: center;
            margin: 30px auto;
            padding: 0 20px;
        }

        #searchBox {
            width: 90%;
            max-width: 600px;
            padding: 15px 20px;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
        }

        /* Main */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            margin: 30px 0 20px;
            color: #e65100;
        }

        /* Districts */
        .districts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .district {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .district:hover {
            transform: translateY(-5px);
            background: #fff3e0;
        }

        /* Categories */
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .category {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .category:hover {
            background: #ffe0b2;
        }

        /* Places */
        .places {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .place-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .place-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .place-content {
            padding: 20px;
        }

        .place-content h3 {
            color: #e65100;
            margin-bottom: 10px;
        }

        .place-content p {
            margin: 8px 0;
            line-height: 1.5;
        }

        .map-button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #e65100;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        /* Back Button */
        .back-button {
            display: none;
            margin: 20px 0;
            padding: 12px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            background: #333;
            color: white;
        }

        @media(max-width: 600px) {
            header h1 {
                font-size: 28px;
            }

            header p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<!-- Header -->
<header>
    <h1>MAHARASHTRA TOURISM EXPLORER</h1>
    <p>महाराष्ट्रातील पर्यटन स्थळे शोधा</p>
</header>

<!-- Search -->
<div class="search-container">
    <input 
        type="text" 
        id="searchBox"
        placeholder="🔍 पर्यटन स्थळ शोधा... (उदा. अजिंठा, वेरूळ)"
        onkeyup="searchPlace()"
    >
</div>

<div class="container">

    <!-- District Section -->
    <section id="districtSection">

        <h2 class="section-title">
            📍 जिल्ह्यानुसार पर्यटन स्थळे शोधा
        </h2>

        <div class="districts">

            <div class="district" onclick="selectDistrict('छत्रपती संभाजीनगर')">
                🏛️<br>
                छत्रपती संभाजीनगर
            </div>

            <div class="district" onclick="selectDistrict('पुणे')">
                🏰<br>
                पुणे
            </div>

            <div class="district" onclick="selectDistrict('नाशिक')">
                🛕<br>
                नाशिक
            </div>

            <div class="district" onclick="selectDistrict('सातारा')">
                ⛰️<br>
                सातारा
            </div>

            <div class="district" onclick="selectDistrict('रत्नागिरी')">
                🏖️<br>
                रत्नागिरी
            </div>

            <div class="district" onclick="selectDistrict('नागपूर')">
                🌳<br>
                नागपूर
            </div>

        </div>

    </section>

    <!-- Category Section -->
    <section id="categorySection" style="display:none;">

        <button class="back-button" 
                style="display:block;"
                onclick="goBack()">
            ← मागे जा
        </button>

        <h2 class="section-title" id="districtTitle"></h2>

        <div class="categories">

            <div class="category" 
                 onclick="showCategory('धार्मिक')">
                🛕<br>
                <b>धार्मिक पर्यटन स्थळे</b>
            </div>

            <div class="category" 
                 onclick="showCategory('ऐतिहासिक')">
                🏰<br>
                <b>ऐतिहासिक पर्यटन स्थळे</b>
            </div>

            <div class="category" 
                 onclick="showCategory('निसर्ग')">
                🌿<br>
                <b>निसर्ग पर्यटन स्थळे</b>
            </div>

        </div>

    </section>

    <!-- Places Section -->
    <section id="placesSection" style="display:none;">

        <h2 class="section-title" id="categoryTitle"></h2>

        <div class="places" id="placesContainer"></div>

    </section>

</div>

<footer>
    © 2026 Maharashtra Tourism Explorer
</footer>


<script>

    /* Tourism Data */

    const places = [

        {
            name: "अजिंठा लेणी",
            district: "छत्रपती संभाजीनगर",
            category: "ऐतिहासिक",
            image: "https://upload.wikimedia.org/wikipedia/commons/3/3f/Ajanta_Caves%2C_India.jpg",
            location: "Ajanta Caves, Maharashtra",
            description: "अजिंठा लेणी ही महाराष्ट्रातील प्रसिद्ध प्राचीन बौद्ध लेणी असून येथील शिल्पकला आणि भित्तिचित्रे जगप्रसिद्ध आहेत.",
            map: "https://maps.google.com/?q=Ajanta+Caves"
        },

        {
            name: "वेरूळ लेणी",
            district: "छत्रपती संभाजीनगर",
            category: "ऐतिहासिक",
            image: "https://upload.wikimedia.org/wikipedia/commons/7/7e/Kailasa_Temple_at_Ellora.jpg",
            location: "Ellora Caves, Maharashtra",
            description: "वेरूळ लेणी हे भारतातील प्रसिद्ध ऐतिहासिक वारसा स्थळ असून येथे बौद्ध, हिंदू आणि जैन लेणी आहेत.",
            map: "https://maps.google.com/?q=Ellora+Caves"
        },

        {
            name: "बीबी का मकबरा",
            district: "छत्रपती संभाजीनगर",
            category: "ऐतिहासिक",
            image: "https://upload.wikimedia.org/wikipedia/commons/4/4c/Bibi_Ka_Maqbara_Aurangabad.jpg",
            location: "Bibi Ka Maqbara, Chhatrapati Sambhajinagar",
            description: "बीबी का मकबरा हे छत्रपती संभाजीनगर शहरातील प्रसिद्ध ऐतिहासिक वास्तू आहे.",
            map: "https://maps.google.com/?q=Bibi+Ka+Maqbara"
        }

    ];


    /* District Select */

    function selectDistrict(district) {

        document.getElementById("districtSection")
            .style.display = "none";

        document.getElementById("categorySection")
            .style.display = "block";

        document.getElementById("placesSection")
            .style.display = "none";

        document.getElementById("districtTitle")
            .innerText = district + " पर्यटन";

    }


    /* Category Select */

    function showCategory(category) {

        const districtTitle =
            document.getElementById("districtTitle").innerText;

        const district =
            districtTitle.replace(" पर्यटन", "");

        const filteredPlaces = places.filter(place =>
            place.district === district &&
            place.category === category
        );

        document.getElementById("categorySection")
            .style.display = "none";

        document.getElementById("placesSection")
            .style.display = "block";

        document.getElementById("categoryTitle")
            .innerText =
            district + " - " + category + " पर्यटन स्थळे";


        const container =
            document.getElementById("placesContainer");

        container.innerHTML = "";


        filteredPlaces.forEach(place => {

            container.innerHTML += `

                <div class="place-card">

                    <img src="${place.image}" 
                         alt="${place.name}">

                    <div class="place-content">

                        <h3>${place.name}</h3>

                        <p>
                            📍 ${place.location}
                        </p>

                        <p>
                            ${place.description}
                        </p>

                        <a 
                            class="map-button"
                            href="${place.map}"
                            target="_blank">
                            🗺️ Google Maps वर पहा
                        </a>

                    </div>

                </div>

            `;

        });

    }


    /* Back */

    function goBack() {

        document.getElementById("categorySection")
            .style.display = "none";

        document.getElementById("placesSection")
            .style.display = "none";

        document.getElementById("districtSection")
            .style.display = "block";

    }


    /* Search */

    function searchPlace() {

        const search =
            document.getElementById("searchBox")
            .value
            .toLowerCase();

        const results =
            places.filter(place =>
                place.name.toLowerCase()
                .includes(search)
            );

        if(search === "") {

            document.getElementById("placesSection")
                .style.display = "none";

            document.getElementById("districtSection")
                .style.display = "block";

            return;

        }

        document.getElementById("districtSection")
            .style.display = "none";

        document.getElementById("categorySection")
            .style.display = "none";

        document.getElementById("placesSection")
            .style.display = "block";


        document.getElementById("categoryTitle")
            .innerText = "🔍 Search Results";


        const container =
            document.getElementById("placesContainer");

        container.innerHTML = "";


        results.forEach(place => {

            container.innerHTML += `

                <div class="place-card">

                    <img src="${place.image}"
                         alt="${place.name}">

                    <div class="place-content">

                        <h3>${place.name}</h3>

                        <p>
                            📍 ${place.location}
                        </p>

                        <p>
                            ${place.description}
                        </p>

                        <a 
                            class="map-button"
                            href="${place.map}"
                            target="_blank">
                            🗺️ Google Maps वर पहा
                        </a>

                    </div>

                </div>

            `;

        });

    }

</script>

</body>
</html>
