<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tourism Categories</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:linear-gradient(135deg,#ff9800,#e65100);
color:white;
padding:30px;
text-align:center;
}

header h1{
font-size:32px;
}

header p{
font-size:18px;
margin-top:8px;
}

.container{
width:90%;
max-width:1100px;
margin:30px auto;
}

.back-btn{
display:inline-block;
padding:12px 20px;
background:#333;
color:white;
text-decoration:none;
border-radius:8px;
margin-bottom:20px;
}

.title{
text-align:center;
color:#e65100;
margin-bottom:25px;
font-size:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
text-align:center;
border-radius:15px;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.15);
transition:.3s;
}

.card:hover{
background:#fff3e0;
transform:translateY(-5px);
}

.card h2{
margin-top:15px;
font-size:22px;
}

footer{
margin-top:40px;
padding:20px;
background:#333;
color:white;
text-align:center;
}
</style>

</head>

<body>

<header>

<h1 id="districtName"></h1>

<p>पर्यटन स्थळांचा प्रकार निवडा</p>

</header>

<div class="container">

<a href="index.html" class="back-btn">⬅️ मागे जा</a>

<h2 class="title">
Tourism Categories
</h2>

<div class="grid">

<div class="card" onclick="openCategory('hindu')">
🛕
<h2>हिंदू धार्मिक पर्यटन</h2>
</div>

<div class="card" onclick="openCategory('historical')">
🏰
<h2>ऐतिहासिक पर्यटन</h2>
</div>

<div class="card" onclick="openCategory('nature')">
🌄
<h2>नैसर्गिक पर्यटन</h2>
</div>

<div class="card" onclick="openCategory('wildlife')">
🐅
<h2>वन्यजीव पर्यटन</h2>
</div>

<div class="card" onclick="openCategory('other')">
🎡
<h2>इतर पर्यटन</h2>
</div>

</div>

</div>

<footer>

© 2026 Maharashtra Tourism Explorer

</footer>

<script>

const district = localStorage.getItem("district") || "महाराष्ट्र";

document.getElementById("districtName").innerHTML =
district + " जिल्हा";

function openCategory(category){

localStorage.setItem("category",category);

alert(
"जिल्हा : " + district +
"\nCategory : " + category +
"\n\nPart 3 मध्ये येथे पर्यटन स्थळे दिसतील."
);

// पुढे हे वापरू
// window.location.href="place.html";

}

</script>

</body>
</html>
