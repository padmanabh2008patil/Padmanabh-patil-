<head>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

header{

max-width:1200px;

}

gap:25px;
}

.place-card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.place-card img{
width:100%;
height:220px;
object-fit:cover;
}

  fetch("data/places.json")

.then(places => {

    const container = document.getElementById("placesContainer");

    // निवडलेल्या जिल्हा आणि Category नुसार स्थळे शोधणे
    const filteredPlaces = places.filter(place =>
        place.district === district &&
        place.category === category
    );

    // जुनी माहिती काढून टाका
    container.innerHTML = "";

    // कोणतेही पर्यटन स्थळ सापडले नाही तर
    if(filteredPlaces.length === 0){

        container.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;">
            <h2 style="color:red;">
            या Category मध्ये सध्या पर्यटन स्थळांची माहिती उपलब्ध नाही.
            </h2>
        </div>
        `;

        return;
    }

    // प्रत्येक पर्यटन स्थळ दाखवणे
    filteredPlaces.forEach((place, index) => {

            >

            <div class="place-content">

                <h2>
                ${place.name}
                </h2>

                <p>
                <b>📍 स्थान :</b>
                ${place.location}
                </p>

                <p>
                ${place.description}
                </p>

                <a 
                class="btn"
                href="${place.map}"
                target="_blank">

                🗺️ Google Maps वर पहा

                </a>

                <button
                class="btn"
                onclick="showGallery(${index})">

                📸 फोटो पहा

                </button>

            </div>

        </div>

        `;

    });

});
      // ================================
// Part 3C - Photo Gallery
// ================================

function showGallery(index){

    fetch("data/places.json")
    .then(response => response.json())
    .then(places => {

        // निवडलेल्या जिल्हा आणि Category नुसार स्थळे शोधणे
        const filteredPlaces = places.filter(place =>
            place.district === district &&
            place.category === category
        );

        // निवडलेले ठिकाण
        const place = filteredPlaces[index];

        if(!place){
            alert("माहिती उपलब्ध नाही.");
            return;
        }

        // Gallery मध्ये photos नसतील तर
        if(!place.gallery || place.gallery.length === 0){

            alert("या पर्यटन स्थळाचे फोटो सध्या उपलब्ध नाहीत.");
            return;

        }

        // फोटोची यादी तयार करणे
        let galleryHTML = "";

        place.gallery.forEach(photo => {

            galleryHTML += `
                <img
                    src="${photo}"
                    alt="${place.name}"
                    style="
                        width:100%;
                        max-width:300px;
                        height:200px;
                        object-fit:cover;
                        margin:10px;
                        border-radius:10px;
                    "
                >
            `;

        });

        // Gallery Popup
        const galleryWindow = window.open(
            "",
            "_blank",
            "width=900,height=700"
        );

        galleryWindow.document.write(`

            <html>

            <head>

                <title>${place.name} - फोटो गॅलरी</title>

                <style>

                    body{
                        font-family:Arial,sans-serif;
                        background:#f5f5f5;
                        text-align:center;
                        padding:20px;
                    }

                    h1{
                        color:#e65100;
                    }

                    .gallery{
                        display:flex;
                        flex-wrap:wrap;
                        justify-content:center;
                        gap:15px;
                    }

                    .gallery img{
                        width:300px;
                        height:200px;
                        object-fit:cover;
                        border-radius:12px;
                        box-shadow:0 4px 12px rgba(0,0,0,.2);
                    }

                </style>

            </head>

            <body>

                <h1>${place.name}</h1>

                <div class="gallery">

                    ${galleryHTML}

                </div>

            </body>

            </html>

        `);

        galleryWindow.document.close();

    })

    .catch(error => {

        console.error(
            "Gallery Error:",
            error
        );

        alert(
            "फोटो लोड करताना समस्या आली."
        );

    });

}
