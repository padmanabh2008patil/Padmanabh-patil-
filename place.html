<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tourism Places</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:linear-gradient(135deg,#ff9800,#e65100);
color:white;
text-align:center;
padding:25px;
}

header h1{
font-size:30px;
}

header p{
margin-top:10px;
font-size:18px;
}

.container{
width:90%;
max-width:1100px;
margin:30px auto;
}

.back-btn{
display:inline-block;
background:#333;
color:white;
text-decoration:none;
padding:12px 20px;
border-radius:8px;
margin-bottom:25px;
}

#placeTitle{
text-align:center;
color:#e65100;
margin-bottom:25px;
font-size:28px;
}

#placesContainer{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.place-card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.place-card img{
width:100%;
height:220px;
object-fit:cover;
}

.place-content{
padding:20px;
}

.place-content h2{
color:#e65100;
margin-bottom:12px;
font-size:23px;
}

.place-content p{
margin:8px 0;
line-height:1.6;
}

.btn{
display:inline-block;
margin-top:15px;
padding:12px 18px;
background:#ff9800;
color:white;
text-decoration:none;
border-radius:8px;
border:none;
cursor:pointer;
font-size:16px;
}

footer{
margin-top:40px;
padding:20px;
background:#333;
color:white;
text-align:center;
}

</style>

</head>

<body>

<header>

<h1 id="districtName"></h1>

<p id="categoryName"></p>

</header>

<div class="container">

<a href="category.html"
class="back-btn">

⬅️ मागे जा

</a>

<h2 id="placeTitle">
पर्यटन स्थळे
</h2>

<div id="placesContainer">
</div>

</div>

<footer>

© 2026 Maharashtra Tourism Explorer

</footer>

<script>

// जिल्हा आणि Category मिळवणे

const district =
localStorage.getItem("district")
|| "महाराष्ट्र";

const category =
localStorage.getItem("category")
|| "";


// नाव दाखवणे

document.getElementById(
"districtName"
).innerHTML =
district + " जिल्हा";

document.getElementById(
"categoryName"
).innerHTML =
category;


// Places load करणे

let filteredPlaces = [];

fetch("data/places.json")

.then(response => {

if(!response.ok){

throw new Error(
"places.json सापडली नाही"
);

}

return response.json();

})

.then(places => {

const container =
document.getElementById(
"placesContainer"
);


// District + Category Filter

filteredPlaces =
places.filter(place =>

place.district === district &&

place.category === category

);


// Places दाखवणे

container.innerHTML = "";


// जर data नसेल

if(filteredPlaces.length === 0){

container.innerHTML = `

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;
background:white;
border-radius:15px;
">

<h2 style="color:red;">
या Category मध्ये पर्यटन स्थळांची माहिती उपलब्ध नाही.
</h2>

<p style="margin-top:15px;">
जिल्हा : ${district}
</p>

<p>
Category : ${category}
</p>

</div>

`;

return;

}


// प्रत्येक Place चे Card

filteredPlaces.forEach((place,index) => {

container.innerHTML += `

<div class="place-card">

<img
src="${place.image}"
alt="${place.name}"
>

<div class="place-content">

<h2>
${place.name}
</h2>

<p>
<b>📍 स्थान :</b>
${place.location}
</p>

<p>
${place.description}
</p>

<button
class="btn"
onclick="openDetails(${index})"
>

📖 पुढे पहा

</button>

</div>

</div>

`;

});

})

.catch(error => {

console.error(error);

document.getElementById(
"placesContainer"
).innerHTML = `

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;
color:red;
">

<h2>
डेटा लोड करताना समस्या आली.
</h2>

<p>
कृपया places.json फाईल तपासा.
</p>

</div>

`;

});


// पर्यटनस्थळाच्या Details Page वर जाणे

function openDetails(index){

const place =
filteredPlaces[index];

if(!place){

alert(
"माहिती उपलब्ध नाही."
);

return;

}


// निवडलेले पर्यटनस्थळ Save करणे

localStorage.setItem(
"selectedPlace",
JSON.stringify(place)
);


// नवीन Page उघडणे

window.location.href =
"details.html";

}

</script>

</body>

</html>
