<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tourism Places</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:linear-gradient(135deg,#ff9800,#e65100);
color:white;
text-align:center;
padding:25px;
}

header h1{
font-size:32px;
}

header p{
margin-top:10px;
font-size:18px;
}

.container{
width:90%;
max-width:1200px;
margin:30px auto;
}

.back-btn{
display:inline-block;
background:#333;
color:white;
text-decoration:none;
padding:12px 20px;
border-radius:8px;
margin-bottom:25px;
}

#placeTitle{
text-align:center;
color:#e65100;
margin-bottom:25px;
}

#placesContainer{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
}

.place-card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.place-card img{
width:100%;
height:220px;
object-fit:cover;
}

.place-content{
padding:
  fetch("data/places.json")
.then(response => response.json())
.then(places => {

    const container = document.getElementById("placesContainer");

    // निवडलेल्या जिल्हा आणि Category नुसार स्थळे शोधणे
    const filteredPlaces = places.filter(place =>
        place.district === district &&
        place.category === category
    );

    // जुनी माहिती काढून टाका
    container.innerHTML = "";

    // कोणतेही पर्यटन स्थळ सापडले नाही तर
    if(filteredPlaces.length === 0){

        container.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;">
            <h2 style="color:red;">
            या Category मध्ये सध्या पर्यटन स्थळांची माहिती उपलब्ध नाही.
            </h2>
        </div>
        `;

        return;
    }

    // प्रत्येक पर्यटन स्थळ दाखवणे
    filteredPlaces.forEach((place, index) => {

        container.innerHTML += `

        <div class="place-card">

            <img 
            src="${place.image}" 
            alt="${place.name}"
            >

            <div class="place-content">

                <h2>
                ${place.name}
                </h2>

                <p>
                <b>📍 स्थान :</b>
                ${place.location}
                </p>

                <p>
                ${place.description}
                </p>

                <a 
                class="btn"
                href="${place.map}"
                target="_blank">

                🗺️ Google Maps वर पहा

                </a>

                <button
                class="btn"
                onclick="showGallery(${index})">

                📸 फोटो पहा

                </button>

            </div>

        </div>

        `;

    });

});
