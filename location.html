<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Location - महाराष्ट्र पर्यटन</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7e6;
      color: #222;
    }

    .header {
      background: linear-gradient(90deg, #8b0000, #e65100, #ff9800);
      color: white;
      text-align: center;
      padding: 22px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    .place-name {
      text-align: center;
      color: #8b0000;
      font-size: 28px;
      margin-bottom: 25px;
    }

    .location-title {
      font-size: 21px;
      font-weight: bold;
      color: #e65100;
      margin-bottom: 10px;
    }

    .location-box {
      background: #fff3e0;
      padding: 18px;
      border-radius: 12px;
      font-size: 19px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .map-title {
      font-size: 21px;
      font-weight: bold;
      color: #e65100;
      margin-bottom: 10px;
    }

    .map-box {
      width: 100%;
      height: 350px;
      background: #eeeeee;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .buttons {
      text-align: center;
      margin-top: 25px;
    }

    .map-button {
      display: inline-block;
      background: #e65100;
      color: white;
      padding: 14px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .back-button {
      display: inline-block;
      margin-left: 10px;
      background: #eeeeee;
      color: #222;
      padding: 14px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
    }

    @media(max-width:600px) {

      .header h1 {
        font-size: 23px;
      }

      .place-name {
        font-size: 24px;
      }

      .map-box {
        height: 280px;
      }

      .map-button,
      .back-button {
        display: block;
        margin: 10px 0;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>📍 पर्यटन स्थळाचे लोकेशन</h1>
  </header>

  <main class="container">

    <div class="card" id="locationContent">

      <h2 class="place-name">लोकेशन शोधत आहे...</h2>

      <div class="location-box">
        कृपया थोडा वेळ थांबा...
      </div>

    </div>

  </main>

  <script>

    // URL मधून पर्यटन स्थळाचे नाव घेणे
    const urlParams = new URLSearchParams(window.location.search);

    const placeName = urlParams.get("name");


    // places.json मधून माहिती घेणे
    fetch("data/places.json")

      .then(response => {

        if (!response.ok) {

          throw new Error("places.json सापडले नाही.");

        }

        return response.json();

      })

      .then(data => {

        // JSON array आहे असे गृहीत
        const places = Array.isArray(data)
          ? data
          : data.places;


        // नावानुसार स्थळ शोधणे
        const place = places.find(
          item => item.name === placeName
        );


        // स्थळ सापडले नाही तर
        if (!place) {

          document.getElementById("locationContent").innerHTML = `

            <div class="error">

              <h2>⚠️ स्थळ सापडले नाही</h2>

              <p>
                या पर्यटन स्थळाची माहिती उपलब्ध नाही.
              </p>

              <div class="buttons">

                <a
                  class="back-button"
                  href="javascript:history.back()"
                >
                  ← मागे जा
                </a>

              </div>

            </div>

          `;

          return;

        }


        // Location दाखवणे
        const location =
          place.location || "Location उपलब्ध नाही";


        // Google Maps link
        const map =
          place.map || "";


        // Page वर माहिती दाखवणे
        document.getElementById("locationContent").innerHTML = `

          <h2 class="place-name">
            ${place.name}
          </h2>


          <div class="location-title">
            📍 Location
          </div>


          <div class="location-box">

            ${location}

          </div>


          <div class="map-title">
            🗺️ Google Maps
          </div>


          <div class="map-box">

            <div>

              <p>
                <strong>
                  ${place.name}
                </strong>
              </p>

              <p>
                📍 ${location}
              </p>

              <p>
                खालील बटनवर क्लिक करून
                Google Maps मध्ये Location पाहा.
              </p>

            </div>

          </div>


          <div class="buttons">

            ${
              map
              ?
              `
              <a
                class="map-button"
                href="${map}"
                target="_blank"
                rel="noopener noreferrer"
              >
                🗺️ Google Maps वर जा
              </a>
              `
              :
              `
              <span class="back-button">
                Map उपलब्ध नाही
              </span>
              `
            }


            <a
              class="back-button"
              href="javascript:history.back()"
            >
              ← मागे जा
            </a>

          </div>

        `;

      })


      // Error आल्यास
      .catch(error => {

        document.getElementById("locationContent").innerHTML = `

          <div class="error">

            <h2>⚠️ Error</h2>

            <p>
              Location माहिती लोड करता आली नाही.
            </p>

            <p>
              ${error.message}
            </p>

          </div>

        `;

      });

  </script>

</body>
</html>
